<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<title>XIAO IMU</title>
<style>
  :root {
    --bg: #0f1720; --panel: #17212c; --line: #26323f; --text: #e6edf3;
    --muted: #8b98a5; --accent: #3fa7d6; --go: #2ea043; --stop: #d1453b;
    --warn: #d29922; --radius: 14px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  main { max-width: 760px; margin: 0 auto; padding: 16px 14px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .3px; }
  .conn { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--stop); }
  .dot.on { background: var(--go); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
            padding: 14px; margin-bottom: 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
       margin: 0 0 10px; font-weight: 600; }

  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { flex: 1; padding: 11px 6px; background: transparent; color: var(--text);
                border: 0; font-size: 15px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.sel { background: var(--accent); color: #fff; font-weight: 600; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
  label.check { display: flex; align-items: center; gap: 8px; font-size: 15px; white-space: nowrap; }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
  input[type=text] { flex: 1; min-width: 0; padding: 10px; border-radius: 10px; border: 1px solid var(--line);
                     background: var(--bg); color: var(--text); font-size: 15px; }
  input:disabled, .seg button:disabled { opacity: .5; }

  #go { width: 100%; margin-top: 14px; padding: 18px; font-size: 20px; font-weight: 700;
        border: 0; border-radius: 12px; color: #fff; background: var(--go); cursor: pointer; }
  #go.stop { background: var(--stop); }
  #go:disabled { opacity: .6; cursor: default; }
  .times { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .times label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  input[type=number] { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line);
                       background: var(--bg); color: var(--text); font-size: 17px; font-variant-numeric: tabular-nums; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .progress { height: 6px; border-radius: 3px; background: var(--line); margin-top: 10px; overflow: hidden; display: none; }
  .progress .fill { height: 100%; width: 0; background: var(--accent); transition: width .5s linear; }
  #runinfo.count { color: var(--warn); font-weight: 600; }
  .runline { display: flex; justify-content: space-between; margin-top: 10px; font-size: 14px; color: var(--muted); }
  #elapsed { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }

  .between { text-align: center; padding: 6px 0 14px; }
  .between .val { font-size: 52px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .between .lbl { color: var(--muted); font-size: 13px; }
  .sensors { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sensor { border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .sensor .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .sensor .name { font-weight: 700; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--line); color: var(--muted); }
  .badge.ok { background: rgba(46,160,67,.2); color: #56d364; }
  .badge.waiting { background: rgba(210,153,34,.2); color: var(--warn); }
  .angles { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-variant-numeric: tabular-nums; }
  .angles dt { color: var(--muted); font-size: 13px; align-self: center; }
  .angles dd { margin: 0; text-align: right; font-size: 20px; font-weight: 600; }
  .bat { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .bat .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bat .fill { height: 100%; width: 0; background: var(--go); transition: width .5s; }
  .bat.low .fill { background: var(--warn); } .bat.low .txt { color: var(--warn); }
  .bat.crit .fill { background: var(--stop); } .bat.crit .txt { color: #ff7b72; }
  .bat .txt { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meta { margin-top: 6px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .meta .bad { color: var(--warn); }

  ul.files { list-style: none; margin: 0; padding: 0; }
  ul.files li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0;
                border-top: 1px solid var(--line); font-size: 14px; }
  ul.files li:first-child { border-top: 0; }
  ul.files a { color: var(--accent); text-decoration: none; word-break: break-all; }
  .empty { color: var(--muted); font-size: 14px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; text-transform: uppercase;
                    letter-spacing: .8px; font-weight: 600; }
  #log { margin: 10px 0 0; max-height: 260px; overflow: auto; font: 12px/1.45 ui-monospace, monospace;
         white-space: pre-wrap; color: #b7c2cd; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--stop);
           color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: 90vw;
           display: none; }
  @media (max-width: 420px) { .sensors { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>XIAO IMU</h1>
    <div class="conn"><span class="dot" id="dot"></span><span id="conntext">connecting…</span></div>
  </header>

  <section>
    <h2>Collect data</h2>
    <div class="seg" id="mode">
      <button data-mode="usb">USB</button>
      <button data-mode="ble">Bluetooth</button>
      <button data-mode="sim">Simulated</button>
    </div>
    <div class="row">
      <label class="check"><input type="checkbox" id="record" checked> Record CSV</label>
      <input type="text" id="name" placeholder="name (optional), e.g. freestyle-1" maxlength="60">
    </div>
    <div class="times">
      <label>Start delay (s)<input type="number" id="delay" min="0" max="3600" step="1" inputmode="numeric"></label>
      <label>Collect time (s)<input type="number" id="duration" min="0" max="86400" step="1" inputmode="numeric"></label>
    </div>
    <div class="hint">Boards connect during the delay; collecting starts when both the delay is over and data is arriving. Collect time 0 = until Stop.</div>
    <button id="go" disabled>Start</button>
    <div class="progress" id="progress"><div class="fill"></div></div>
    <div class="runline"><span id="runinfo">Stopped</span><span id="elapsed"></span></div>
  </section>

  <section>
    <h2>Live</h2>
    <div class="between"><div class="val" id="between">--</div><div class="lbl">degrees between boards</div></div>
    <div class="sensors" id="sensors"></div>
  </section>

  <section>
    <h2>Recordings</h2>
    <ul class="files" id="files"></ul>
  </section>

  <section>
    <details>
      <summary>Messages</summary>
      <pre id="log"></pre>
    </details>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const MODE_NAMES = { usb: "USB", ble: "Bluetooth", sim: "Simulated" };
let state = { running: false, busy: false };
let mode = localStorage.getItem("mode") || "usb";
let clockOffset = 0;   // server time - local time, so the timer is right on any device

// ---------- sensor cards ----------
function sensorCard(id) {
  const el = document.createElement("div");
  el.className = "sensor";
  el.innerHTML = `
    <div class="top"><span class="name">Board ${id}</span><span class="badge">--</span></div>
    <dl class="angles">
      <dt>Roll</dt><dd data-k="roll">--</dd>
      <dt>Pitch</dt><dd data-k="pitch">--</dd>
      <dt>Yaw</dt><dd data-k="yaw">--</dd>
    </dl>
    <div class="bat"><span>Battery</span><div class="bar"><div class="fill"></div></div><span class="txt">--</span></div>
    <div class="meta"><span data-k="samples">0 samples</span><span data-k="buf"></span></div>`;
  $("sensors").appendChild(el);
  return el;
}
const cards = [sensorCard(1), sensorCard(2)];

// Approximate state of charge for a 1-cell LiPo at light load (mV -> %).
const LIPO = [[4200,100],[4150,95],[4110,90],[4080,85],[4020,80],[3980,75],[3950,70],[3910,65],
              [3870,60],[3850,55],[3840,50],[3820,45],[3800,40],[3790,35],[3770,30],[3750,25],
              [3730,20],[3710,15],[3690,10],[3610,5],[3300,0]];
// These batteries stop charging at about 4.08 V (measured 2026-11-14), not
// 4.20 V. Stretch the curve above KNEE_MV so FULL_MV reads 100%; below the
// knee nothing changes, so the low-battery warnings keep their meaning.
const FULL_MV = 4080, KNEE_MV = 3800;
function batteryPct(mv) {
  if (mv > KNEE_MV) mv = KNEE_MV + (mv - KNEE_MV) * (LIPO[0][0] - KNEE_MV) / (FULL_MV - KNEE_MV);
  if (mv >= LIPO[0][0]) return 100;
  for (let i = 1; i < LIPO.length; i++) {
    const [v1, p1] = LIPO[i - 1], [v0, p0] = LIPO[i];
    if (mv >= v0) return Math.round(p0 + (p1 - p0) * (mv - v0) / (v1 - v0));
  }
  return 0;
}
const lastBattery = {};   // keep the last reading per board between runs

function showBattery(card, id, mv) {
  if (mv) lastBattery[id] = mv; else mv = lastBattery[id];
  const box = card.querySelector(".bat");
  if (!mv) { box.className = "bat"; box.querySelector(".txt").textContent = "--";
             box.querySelector(".fill").style.width = "0"; return; }
  const pct = batteryPct(mv);
  box.className = "bat" + (pct <= 10 ? " crit" : pct <= 25 ? " low" : "");
  box.querySelector(".fill").style.width = pct + "%";
  box.querySelector(".txt").textContent = `${pct}% · ${(mv / 1000).toFixed(2)} V`;
}

function fmt(v) { return (v >= 0 ? "+" : "") + v.toFixed(1) + "°"; }

function showStatus(st) {
  (st.sensors || []).forEach((s, i) => {
    const c = cards[i]; if (!c) return;
    const badge = c.querySelector(".badge");
    const labels = { ok: "live", waiting: "waiting", absent: "not connected" };
    badge.textContent = labels[s.state] || s.state;
    badge.className = "badge " + s.state;
    for (const k of ["roll", "pitch", "yaw"])
      c.querySelector(`[data-k=${k}]`).textContent = s.state === "ok" ? fmt(s[k]) : "--";
    c.querySelector("[data-k=samples]").textContent =
      s.state === "ok" ? `${s.samples} samples${s.gaps ? `, ${s.gaps} gaps` : ""}` : "";
    showBattery(c, s.id || i + 1, s.bat_mv);
    const buf = c.querySelector("[data-k=buf]");
    buf.textContent = s.state === "ok" ? `buffer ${s.buf}` : "";
    buf.className = s.buf > 20 ? "bad" : "";
  });
  $("between").textContent = st.between == null ? "--" : st.between.toFixed(1) + "°";
}

function clearLive() {
  showStatus({ sensors: [{ state: "absent" }, { state: "absent" }], between: null });
  cards.forEach(c => { const b = c.querySelector(".badge"); b.textContent = "--"; b.className = "badge"; });
}

// ---------- controls ----------
function render() {
  document.querySelectorAll("#mode button").forEach(b => {
    b.classList.toggle("sel", b.dataset.mode === (state.running ? state.mode : mode));
    b.disabled = state.running || state.busy;
  });
  for (const id of ["record", "name", "delay", "duration"]) $(id).disabled = state.running || state.busy;
  const go = $("go");
  go.disabled = (state.busy && !state.running) || !ws || ws.readyState !== 1;
  go.textContent = state.busy && !state.running ? "Starting…"
                 : state.phase === "delay" ? "Cancel" : state.running ? "Stop" : "Start";
  go.classList.toggle("stop", state.running);
  tick();
}

function clock(s) {
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s / 60), h = Math.floor(m / 60);
  return (h ? h + ":" + String(m % 60).padStart(2, "0") : m) + ":" + String(s % 60).padStart(2, "0");
}

// Status line, timer and progress bar for the current phase.
function tick() {
  const now = Date.now() / 1000 + clockOffset;
  const info = $("runinfo"), bar = $("progress");
  const where = state.mode ? MODE_NAMES[state.mode] + (state.csv ? " · recording" : "") : "";
  info.className = ""; bar.style.display = "none"; $("elapsed").textContent = "";
  if (state.phase === "delay" && state.delay_until) {
    info.textContent = `Starting in ${Math.max(0, Math.ceil(state.delay_until - now))} s · `
                     + (state.have_data ? "boards ready" : "connecting…");
    info.className = "count";
  } else if (state.phase === "delay" || state.phase === "connecting") {
    info.textContent = `Connecting · ${where}`;
  } else if (state.phase === "collecting") {
    const t = now - state.started_at;
    info.textContent = `Collecting · ${where}`;
    if (state.duration) {
      $("elapsed").textContent = `${clock(Math.min(t, state.duration))} / ${clock(state.duration)}`;
      bar.style.display = "block";
      bar.firstElementChild.style.width = Math.min(100, 100 * t / state.duration) + "%";
    } else $("elapsed").textContent = clock(t);
  } else info.textContent = "Stopped";
}
setInterval(tick, 500);

document.querySelectorAll("#mode button").forEach(b => b.onclick = () => {
  mode = b.dataset.mode; localStorage.setItem("mode", mode); render();
});
$("record").checked = localStorage.getItem("record") !== "0";
$("delay").value = localStorage.getItem("delay") ?? 0;
$("duration").value = localStorage.getItem("duration") ?? 100;
for (const id of ["delay", "duration"]) $(id).onchange = () => localStorage.setItem(id, $(id).value);
$("record").onchange = () => localStorage.setItem("record", $("record").checked ? "1" : "0");

$("go").onclick = async () => {
  const starting = !state.running;
  if (starting) { state.busy = true; render(); }
  try {
    const r = await fetch(starting ? "/api/start" : "/api/stop", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(starting ? { mode, record: $("record").checked, name: $("name").value,
                                       delay: Number($("delay").value) || 0,
                                       duration: Number($("duration").value) || 0 } : {})
    });
    if (!r.ok) toast(await r.text());
    else if (starting) clearLive();
  } catch (e) { toast("Can't reach the NUC"); }
};

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 5000);
}

// ---------- recordings & log ----------
function showFiles(files) {
  const ul = $("files"); ul.innerHTML = "";
  if (!files.length) { ul.innerHTML = '<li class="empty">No recordings yet</li>'; return; }
  for (const f of files) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = "/recordings/" + encodeURIComponent(f.name); a.textContent = f.name;
    const size = document.createElement("span"); size.className = "empty";
    size.textContent = f.bytes > 1e6 ? (f.bytes / 1e6).toFixed(1) + " MB" : Math.ceil(f.bytes / 1e3) + " kB";
    li.append(a, size); ul.appendChild(li);
  }
}

function addLog(line) {
  const log = $("log");
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
  log.textContent += line + "\n";
  const lines = log.textContent.split("\n");
  if (lines.length > 300) log.textContent = lines.slice(-300).join("\n");
  if (atBottom) log.scrollTop = log.scrollHeight;
}

// ---------- live connection ----------
let ws;
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () => { $("dot").classList.add("on"); $("conntext").textContent = "connected"; render(); };
  ws.onclose = () => {
    $("dot").classList.remove("on"); $("conntext").textContent = "reconnecting…"; render();
    setTimeout(connect, 2000);
  };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "state") {
      const wasRunning = state.running;
      state = m; clockOffset = m.server_time - Date.now() / 1000;
      if (!m.running && !m.busy)   // keep the last values on screen, but say they're not live
        cards.forEach(c => { const b = c.querySelector(".badge");
          if (b.textContent !== "--") { b.textContent = "stopped"; b.className = "badge"; } });
      render(); tick();
    } else if (m.type === "status") showStatus(m);
    else if (m.type === "log") addLog(m.line);
    else if (m.type === "loghistory") { $("log").textContent = ""; m.lines.forEach(addLog); }
    else if (m.type === "recordings") showFiles(m.files);
  };
}
clearLive(); render(); connect();
</script>
</body>
</html>
